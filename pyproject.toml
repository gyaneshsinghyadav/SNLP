[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-graph-intelligence"
version = "0.1.0"
description = "Temporal link prediction with graph heuristics, GCN, DQN, EWC and rehearsal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.3", "torch>=2.2", "matplotlib>=3.7"]

[project.optional-dependencies]
ogb = ["ogb>=1.3.6"]
test = ["pytest>=8"]

[project.scripts]
adaptive-graph = "adaptive_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
